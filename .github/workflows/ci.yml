name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # Versi pnpm diambil dari field "packageManager" di package.json.

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint (termasuk aturan batas dependency)
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      # Coverage, bukan `pnpm test` biasa: ambang 100% pada modul nutrition
      # ditegakkan di sini. Cabang yang tidak teruji di engine berarti angka
      # yang tidak pernah diperiksa sampai ada pengguna yang menerimanya.
      - name: Test + coverage
        run: pnpm test:coverage

      - name: Build
        run: pnpm build
